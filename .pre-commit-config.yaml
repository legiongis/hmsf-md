---
repos:

  - repo: meta
    hooks:
      - id: check-hooks-apply

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npm run prettier:fix
        language: system
        files: fpan/src
      - id: eslint
        name: eslint
        entry: npm run eslint:fix
        language: system
        files: fpan/src
      - id: typescript
        name: typescript
        entry: bash -c 'npm run ts:check'
        language: system
        types_or: [
          "ts",
          "vue",
        ]
